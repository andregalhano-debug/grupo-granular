<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Speech bubble body -->
  <rect x="28" y="10" width="64" height="52" rx="12" stroke="white" stroke-width="4" fill="none"/>
  <!-- Bubble tail centered -->
  <path d="M52 62 L60 76 L68 62" stroke="white" stroke-width="4" stroke-linejoin="round" fill="none"/>
  <!-- Hair swoosh -->
  <path d="M34 18 Q60 6 86 16" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Left lens -->
  <circle cx="48" cy="38" r="10" stroke="white" stroke-width="3" fill="none"/>
  <!-- Right lens -->
  <circle cx="72" cy="38" r="10" stroke="white" stroke-width="3" fill="none"/>
  <!-- Bridge -->
  <line x1="58" y1="38" x2="62" y2="38" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Left pupil -->
  <circle cx="48" cy="38" r="3.5" fill="white"/>
  <!-- Right pupil -->
  <circle cx="72" cy="38" r="3.5" fill="white"/>
  <!-- "anota" text -->
  <text x="14" y="108" font-family="'Nunito', 'Varela Round', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="22" font-weight="700" fill="white" letter-spacing="-0.3">anota</text>
  <!-- "AI" text -->
  <text x="82" y="108" font-family="'Nunito', 'Varela Round', Arial, sans-serif" font-size="22" font-weight="800" fill="white">AI</text>
</svg>
